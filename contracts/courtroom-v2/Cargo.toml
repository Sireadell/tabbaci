[package]
name = "courtroom-v2"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
base64 = "0.22"
hex = "0.4"
courtroom-rules = { path = "../rules" }
bond-payout = { path = "../payout" }
judgeverify = { path = "../judgeverify" }


[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
