[package]
name = "courtroom"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
base64 = "0.22"
hex = "0.4"
courtroom-rules = { path = "../rules" }
bond-payout = { path = "../payout" }


[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
