<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page | Tabbaci</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="index.html">Tabbaci</a>
<nav><a href="index.html">Try to lie</a><a href="ledger.html">Ledger</a><a class="on" href="pages.html">Pages</a></nav></div></header>
<main class="wrap narrow">
<section class="hero">
  <h1 id="title">Loading...</h1>
  <p class="lead" id="intro"></p>
  <p class="mute" id="by"></p>
</section>
<p class="mute legend">The word before each sentence is how sure its writer said it was: <b>is</b> (95 in 100), <b>very likely</b> (80), <b>likely</b> (65), <b>disputed</b> (50). A sure word earns more when right and loses more when wrong.</p>
<div id="list"></div>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script>
const slug = new URLSearchParams(location.search).get('p') || 'near-chain';
fetch(`pages/${slug}.json`).then((r) => r.json()).then(async (p) => {
  document.title = p.title;
  document.getElementById('title').textContent = p.title;
  document.getElementById('intro').textContent = p.intro;
  document.getElementById('by').textContent = 'Written by: ' + p.written_by + '. Network: NEAR ' + Site.CFG.network + '.';
  const box = document.getElementById('list');
  for (const s of p.sentences) {
    const el = document.createElement('article');
    el.className = 'sentence';
    el.innerHTML = `<p class="claimline"><span class="word">${Site.esc(s.word)}</span> ${Site.esc(s.claim)}</p><p class="mute">Asking the contract...</p>`;
    box.appendChild(el);
    Site.view('get_round', { round: s.round }).then((r) => {
      const [label, cls] = Site.outcomeOf(r);
      el.lastElementChild.outerHTML = `<p class="meta">Ruling: <b class="${cls}">${label}</b> · ${s.kind === 'data' ? 'decided by the numbers' : 'decided by the judges'} · ${r.bonds.map(Site.bondLine).join(' · ')}</p><details><summary>Check it yourself (round ${s.round})</summary><pre>${Site.esc(Site.verifyCmd(s.round))}</pre></details>`;
    }).catch(() => { el.lastElementChild.textContent = 'Could not reach the contract.'; });
  }
});
</script>
</body></html>
