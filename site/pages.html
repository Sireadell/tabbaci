<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pages | Tabbaci</title>
<meta name="description" content="Encyclopedia pages where every sentence has a stamp and a bond behind it.">
<link rel="stylesheet" href="style.css"></head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<header class="top" id="top"></header>
<main id="main" class="wrap">
<section class="page-head">
  <p class="label">Pages</p>
  <h1>Pages where every sentence can be wrong</h1>
  <p class="lead">A writer picks a word for each sentence (is, very likely, likely, disputed) and puts money behind it. The court rules, and a fixed public rule moves the money. Each sentence below carries its stamp.</p>
</section>
<div class="plist" id="list"><p class="mute">Loading...</p></div>
</main>
<footer id="foot"></footer>
<script src="config.js"></script><script src="app.js"></script>
<script>
Site.chrome('pages');
Promise.all([fetch('pages/index.json').then((r) => r.json()), fetch('data/drafted.json').then((r) => (r.ok ? r.json() : null)).catch(() => null), Site.allRounds()]).then(([l, dr, { rounds }]) => {
  const lies = rounds.filter(Site.isLie).length;
  const cards = l.map((p) => `<a class="pagelink" href="page.html?p=${encodeURIComponent(p.slug)}"><b>${esc(p.title)}</b><span class="mute">${p.count} checked sentences</span></a>`);
  if (dr) cards.push(`<a class="pagelink" href="page.html?p=drafted"><b>${esc(dr.title)}</b><span class="mute">Drafted by an AI model from sentences the court ruled true</span></a>`);
  cards.push(`<a class="pagelink" href="page.html?p=lies"><b>The struck-out lies</b><span class="mute">${lies} planted lies, each crossed out with the fine it cost</span></a>`);
  $('list').innerHTML = cards.join('');
});
</script>
</body></html>
